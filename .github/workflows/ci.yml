# Three jobs: the pre-commit checks, the tests, and the whole pipeline on the MIMIC-IV and the eICU demo (ci/demo.sh).
# The demos are open data, downloaded from PhysioNet and cached; the vocabulary is the fixture in
# omop_etl/tests/fixtures/vocabulary.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIMIC_IV_DEMO: ${{ github.workspace }}/_data/mimic-iv-demo
  EICU_DEMO: ${{ github.workspace }}/_data/eicu-crd-demo

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run the pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - name: Restore the MIMIC-IV demo
        id: demo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIMIC_IV_DEMO }}
          key: mimic-iv-demo-2.2
      - name: Download the MIMIC-IV demo
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: bash ci/get_mimic_iv_demo.sh "$MIMIC_IV_DEMO"
      - name: Save the MIMIC-IV demo
        if: steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIMIC_IV_DEMO }}
          key: mimic-iv-demo-2.2
      - name: Install the environment
        run: uv sync --locked
      - name: Run the tests
        run: uv run --no-sync pytest

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - name: Restore the MIMIC-IV demo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MIMIC_IV_DEMO }}
          key: mimic-iv-demo-2.2
      - name: Restore the eICU demo
        id: eicu-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EICU_DEMO }}
          key: eicu-crd-demo-2.0.1
      - name: Download the eICU demo
        if: steps.eicu-cache.outputs.cache-hit != 'true'
        run: bash ci/get_eicu_demo.sh "$EICU_DEMO"
      - name: Save the eICU demo
        if: steps.eicu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EICU_DEMO }}
          key: eicu-crd-demo-2.0.1
      - name: Install the environment
        run: uv sync --locked
      - name: Run the pipeline on the demos
        run: uv run --no-sync bash ci/demo.sh "$RUNNER_TEMP/demo"
