[project]
name = "omop-etl"
version = "0.1.0"
description = "MIMIC-IV, eICU-CRD and HiRID -> OMOP CDM v5.4 parquet"
requires-python = "==3.13.*"
# installed with the rest from the environment at the repository root (../pyproject.toml, ../env.sh)
dependencies = [
    "duckdb==1.5.3",
    "pandas>=2.3",
    "pyarrow==23.0.1",
    "pyyaml==6.0.3",
]

[project.scripts]
omop-etl = "omop_etl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omop_etl"]
