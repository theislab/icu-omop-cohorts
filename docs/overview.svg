<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>From ICU databases through an OMOP CDM to analysis in Python and the YAIB benchmark</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2da44e"/>
    </marker>
  </defs>

  <!-- a white card, so the figure reads the same in GitHub's light and dark themes -->
  <rect x="0.5" y="0.5" width="999" height="419" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1. the ICU databases -->
  <text x="24" y="38" font-size="15" font-weight="700" fill="#1f2328">ICU databases</text>
  <text x="24" y="56" font-size="12" fill="#57606a">on PhysioNet</text>

  <g>
    <rect x="24" y="72" width="190" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M38,86 v16 a11,4 0 0 0 22,0 v-16" fill="#dbe7fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <ellipse cx="49" cy="86" rx="11" ry="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="70" y="92" font-size="14" font-weight="700" fill="#2f6fd6">MIMIC-IV</text>
    <text x="70" y="108" font-size="11" fill="#57606a">3.1 · open demo 2.2</text>
  </g>
  <g>
    <rect x="24" y="128" width="190" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M38,142 v16 a11,4 0 0 0 22,0 v-16" fill="#fbe3cf" stroke="#d9730d" stroke-width="1.5"/>
    <ellipse cx="49" cy="142" rx="11" ry="4" fill="#ffffff" stroke="#d9730d" stroke-width="1.5"/>
    <text x="70" y="148" font-size="14" font-weight="700" fill="#d9730d">eICU-CRD</text>
    <text x="70" y="164" font-size="11" fill="#57606a">2.0 · open demo 2.0.1</text>
  </g>
  <g>
    <rect x="24" y="184" width="190" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M38,198 v16 a11,4 0 0 0 22,0 v-16" fill="#e8defa" stroke="#8250df" stroke-width="1.5"/>
    <ellipse cx="49" cy="198" rx="11" ry="4" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
    <text x="70" y="204" font-size="14" font-weight="700" fill="#8250df">HiRID</text>
    <text x="70" y="220" font-size="11" fill="#57606a">1.1.1</text>
  </g>

  <!-- any other OMOP CDM, straight into the CDM column -->
  <g>
    <rect x="24" y="266" width="190" height="50" rx="8" fill="#f3fbf5" stroke="#2da44e" stroke-dasharray="5 4"/>
    <circle cx="49" cy="291" r="11" fill="#2da44e"/>
    <path d="M44,291 h10 M49,286 v10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="70" y="287" font-size="13" font-weight="700" fill="#1a7f37">any OMOP CDM</text>
    <text x="70" y="303" font-size="11" fill="#57606a">yours, or another ETL's</text>
  </g>
  <path d="M214,291 H390 V250" fill="none" stroke="#2da44e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <!-- omop_etl -->
  <path d="M214,95 H234 M214,151 H234 M214,207 H234 M234,95 V207" fill="none" stroke="#6e7781" stroke-width="1.5"/>
  <path d="M234,151 H306" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="241" y="122" width="62" height="20" rx="5" fill="#e9f7ee" stroke="#2da44e"/>
  <text x="272" y="136" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#1a7f37" text-anchor="middle">omop_etl</text>
  <text x="272" y="170" font-size="11" fill="#57606a" text-anchor="middle">DuckDB SQL</text>

  <!-- 2. the OMOP CDM -->
  <rect x="310" y="40" width="160" height="208" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="324" y="64" font-size="14" font-weight="700" fill="#1f2328">OMOP CDM v5.4</text>
  <text x="324" y="81" font-size="11" fill="#57606a">one Parquet file per table</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#57606a">
    <g>
      <rect x="324" y="94" width="132" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="324.5" y="94.5" width="44" height="5" fill="#2f6fd6"/><rect x="368.5" y="94.5" width="44" height="5" fill="#d9730d"/><rect x="412.5" y="94.5" width="43" height="5" fill="#8250df"/>
      <text x="332" y="116">VISIT_OCCURRENCE</text>
    </g>
    <g>
      <rect x="324" y="132" width="132" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="324.5" y="132.5" width="44" height="5" fill="#2f6fd6"/><rect x="368.5" y="132.5" width="44" height="5" fill="#d9730d"/><rect x="412.5" y="132.5" width="43" height="5" fill="#8250df"/>
      <text x="332" y="154">MEASUREMENT</text>
    </g>
    <g>
      <rect x="324" y="170" width="132" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="324.5" y="170.5" width="44" height="5" fill="#2f6fd6"/><rect x="368.5" y="170.5" width="44" height="5" fill="#d9730d"/><rect x="412.5" y="170.5" width="43" height="5" fill="#8250df"/>
      <text x="332" y="192">DRUG_EXPOSURE …</text>
    </g>
  </g>
  <text x="324" y="222" font-size="10.5" fill="#57606a">standard concepts:</text>
  <text x="324" y="235" font-size="10.5" fill="#57606a">LOINC, RxNorm, SNOMED</text>

  <path d="M470,151 H506" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. ehrdata and ehrapy -->
  <rect x="510" y="40" width="190" height="212" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="524" y="64" font-size="14" font-weight="700" fill="#1f2328">ehrdata</text>
  <text x="524" y="81" font-size="11" fill="#57606a">stays × variables × hours</text>
  <g stroke="#8c959f" stroke-width="1.2">
    <path d="M556,104 l18,-12 h70 l-18,12 z" fill="#eaeef2"/>
    <path d="M626,104 l18,-12 v46 l-18,12 z" fill="#d8dee4"/>
    <rect x="556" y="104" width="70" height="46" fill="#ffffff"/>
    <path d="M556,115.5 h70 M556,127 h70 M556,138.5 h70 M573.5,104 v46 M591,104 v46 M608.5,104 v46" stroke="#d0d7de" stroke-width="1"/>
  </g>
  <text x="532" y="132" font-size="10" fill="#57606a" text-anchor="middle" transform="rotate(-90 532 128)">stays</text>
  <text x="591" y="164" font-size="10" fill="#57606a" text-anchor="middle">variables</text>
  <text x="652" y="146" font-size="10" fill="#57606a">hours</text>
  <line x1="524" y1="176" x2="686" y2="176" stroke="#d0d7de"/>
  <text x="524" y="198" font-size="14" font-weight="700" fill="#1f2328">ehrapy</text>
  <text x="580" y="198" font-size="11" fill="#57606a">scores, phenotypes</text>
  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <rect x="524" y="212" width="42" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="545" y="227">SOFA</text>
    <rect x="572" y="212" width="62" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="603" y="227">Sepsis-3</text>
    <rect x="640" y="212" width="50" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="665" y="227">KDIGO</text>
  </g>

  <!-- the two ways on -->
  <path d="M700,151 H722 M722,104 V292" fill="none" stroke="#6e7781" stroke-width="1.5"/>
  <path d="M722,104 H746" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M722,292 H746" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- a) analysis and models in Python -->
  <rect x="750" y="40" width="226" height="128" rx="10" fill="#f3fbf5" stroke="#2da44e"/>
  <text x="764" y="64" font-size="15" font-weight="700" fill="#1a7f37">a</text>
  <text x="780" y="64" font-size="13" font-weight="700" fill="#1f2328">Analysis and ML in Python</text>
  <text x="764" y="83" font-size="11" fill="#57606a">the notebook: ehrapy's plots and tools,</text>
  <text x="764" y="98" font-size="11" fill="#57606a">any model, e.g. PyPOTS or PyTorch</text>
  <polyline points="766,140 782,138 798,139 814,131 830,133 846,124 862,126 878,118 894,121 910,113 926,116 942,110 958,112" fill="none" stroke="#2f6fd6" stroke-width="2" stroke-linejoin="round"/>
  <line x1="878" y1="108" x2="878" y2="146" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="3 2"/>
  <g stroke="#6e7781" stroke-width="1.5">
    <path d="M790,154 v6 M798,154 v6 M806,154 v6 M846,154 v6 M854,154 v6 M902,154 v6 M910,154 v6 M918,154 v6 M926,154 v6"/>
  </g>

  <!-- b) the benchmark -->
  <rect x="750" y="196" width="226" height="180" rx="10" fill="#f3fbf5" stroke="#2da44e"/>
  <text x="764" y="220" font-size="15" font-weight="700" fill="#1a7f37">b</text>
  <text x="780" y="220" font-size="13" font-weight="700" fill="#1f2328">A benchmark at scale</text>
  <text x="764" y="239" font-size="11" fill="#57606a"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a7f37">cohorts/</tspan> writes YAIB's frames of</text>
  <text x="764" y="254" font-size="11" fill="#57606a">5 clinical tasks, per dataset</text>
  <g font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" text-anchor="middle">
    <rect x="764" y="266" width="86" height="20" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="807" y="280">mortality24</text>
    <rect x="856" y="266" width="34" height="20" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="873" y="280">aki</text>
    <rect x="896" y="266" width="54" height="20" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="923" y="280">sepsis</text>
    <rect x="764" y="292" width="112" height="20" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="820" y="306">kidney_function</text>
    <rect x="882" y="292" width="34" height="20" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="899" y="306">los</text>
  </g>
  <rect x="764" y="326" width="198" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="863" y="341" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">YAIB</text>
  <text x="863" y="355" font-size="10.5" fill="#57606a" text-anchor="middle">models, training, evaluation</text>

  <!-- legend -->
  <g font-size="11" fill="#57606a">
    <rect x="24" y="388" width="12" height="12" rx="3" fill="#e9f7ee" stroke="#2da44e"/>
    <text x="42" y="398">this repository</text>
    <rect x="140" y="388" width="12" height="12" rx="3" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="158" y="398">standards and tools it builds on</text>
  </g>
</svg>
